aid: iprice
name: iPrice
description: >-
  iPrice Group is a Southeast Asian e-commerce aggregator and price-comparison
  platform headquartered in Kuala Lumpur, Malaysia. It aggregates billions of
  live product offers and thousands of coupons from more than a thousand retail
  partners, letting shoppers compare prices, discover deals, and make more
  informed purchases across seven markets: Malaysia, Indonesia, Singapore,
  Thailand, Vietnam, the Philippines, and Hong Kong. Backed by 500 Global as part
  of the Asia Venture Group portfolio, iPrice serves tens of millions of monthly
  visitors and is known for its large SEA e-commerce dataset. As of this profile,
  iPrice does not publish a public consumer or partner API, developer portal, or
  OpenAPI; this record is a company profile in the API Evangelist network.
